# Flatpak manifest for Brain.
#
# The interesting permission question here is the vault. Brain's notes live in
# a folder the user chooses, which is by definition outside the sandbox — so
# unlike Stickies and Planner, this cannot ship with no filesystem access at
# all. It goes through the file portal instead: GtkFileDialog returns a path
# the sandbox can reach, and the document store keeps that grant across
# restarts. No --filesystem is therefore declared. If a grant held for the
# app's lifetime turns out not to survive in practice, the documented retreat
# is --filesystem=home, and it should be argued for rather than slipped in.
#
# Build:  packaging/build-flatpak.sh

id: us.hagreli.Brain

# GNOME 50: the first runtime carrying libadwaita 1.9, which this is compiled
# against (AdwToggleGroup, AdwInlineViewSwitcher), and GTK 4.22. GTK must be at
# least 4.16 for the CSS custom properties the stylesheet uses.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: brain

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Deliberately absent:
  #   --filesystem=*      the vault is reached through the file portal, and the
  #                       document store persists that grant across restarts
  #   --share=network     nothing here talks to the network
  #   --talk-name=*       nothing here talks to another application

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/brain/cargo
  # No --share=network build-arg: Flathub builds with the network off, and
  # cargo-sources.json supplies every crate with a checksum, so it is not
  # needed. Adding it back would make this unacceptable for submission.

modules:
  - name: brain
    buildsystem: simple
    build-options:
      env:
        # Dependencies come from cargo-sources.json, not the network, so
        # Flathub's offline builders can reproduce this.
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked

      - install -Dm755 target/release/brain /app/bin/brain
      - install -Dm644 data/us.hagreli.Brain.desktop
          /app/share/applications/us.hagreli.Brain.desktop
      - install -Dm644 data/us.hagreli.Brain.metainfo.xml
          /app/share/metainfo/us.hagreli.Brain.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/us.hagreli.Brain.svg
          /app/share/icons/hicolor/scalable/apps/us.hagreli.Brain.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/us.hagreli.Brain-symbolic.svg
          /app/share/icons/hicolor/symbolic/apps/us.hagreli.Brain-symbolic.svg

      # Required: the desktop file is DBusActivatable, and build-export fails
      # hard if the matching service file is missing.
      - install -Dm644 packaging/flatpak/us.hagreli.Brain.service
          /app/share/dbus-1/services/us.hagreli.Brain.service

    sources:
      # Local builds read the working tree. For a Flathub submission, replace
      # this with the tagged release:
      #
      #   - type: git
      #     url: https://github.com/mhagrelius/brain.git
      #     tag: v0.1.0
      #     commit: <full sha>
      - type: dir
        path: ../..

      # Generated by build-flatpak.sh from Cargo.lock.
      - cargo-sources.json
