[package]
name = "brain-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Brain's vault, notes, index and search — nothing here draws"
license = "GPL-3.0-or-later"

[dependencies]
# The Markdown scanner, which Brain used to carry in-tree. It moved out when
# Stickies' copy and this one had drifted into two maintenance burdens for one
# parser; Familiar reads it through the re-export in lib.rs. No dependencies and
# nothing in it draws, so it belongs on this side of the line.
quill = { git = "https://github.com/mhagrelius/quill", rev = "e28603237916589af22314acbb098849fd5da8fa" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dates in frontmatter (created/updated).
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }

[dev-dependencies]
tempfile = "3"
