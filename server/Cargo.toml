[package]
name = "brain-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "The vault and its vectors, shared between one person's machines"
license = "GPL-3.0-or-later"

[[bin]]
name = "brain-server"
path = "src/main.rs"

[lib]
name = "brain_server"
path = "src/lib.rs"

[dependencies]
# For `semantic::Digest` and `sync::Hash`, and nothing else. The server must
# hash exactly the way the client does or every lookup misses and every write
# looks stale, and sharing the types is the only way to be sure of that — a
# second implementation of the same hash is a bug waiting for someone to
# change one of them.
brain-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No HTTP crate. Three routes, JSON bodies, one client, on a private network:
# request line, headers to the blank line, Content-Length, body, respond,
# close. That is the whole protocol this needs and it is about a hundred lines
# of exhaustively testable parsing — the same argument that kept a YAML parser
# out of the frontmatter and a CommonMark crate out of the scanner. If this
# ever needs keep-alive, chunked bodies or TLS, it should take a real server
# rather than grow one.

[dev-dependencies]
tempfile = "3"
