[workspace]
members = ["core"]

[package]
name = "brain"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A Markdown notebook for the GNOME desktop"
license = "GPL-3.0-or-later"

[[bin]]
name = "brain"
path = "src/main.rs"

[lib]
name = "brain"
path = "src/lib.rs"

[dependencies]
# The vault, the notes, the index and the search. Links no UI toolkit, so it is
# the half that a shell on another platform would keep. Re-exported from
# src/lib.rs as `brain::model`, which is the path every call site here uses.
brain-core = { path = "core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
# Direct dependency purely to raise the API level above what gtk4 pulls in:
# ApplicationCommandLine::print_literal is gated behind v2_80, and the vault
# directory monitors want the v2_80 GFileMonitor signal shape.
gio = { version = "0.22", features = ["v2_80"] }
serde_json = "1"
# The platform's HTTP client, for the one thing Brain talks to over a socket:
# a local llama.cpp server that turns notes into vectors. It ships in
# org.gnome.Sdk, so it costs nothing at packaging, and Familiar already speaks
# to the same server through it — a pattern established in one of these apps is
# the pattern here. Needs `libsoup-3.0-dev` to build. The calls Brain makes are
# blocking ones on a worker thread rather than the async ones on the main loop:
# the embedding work is a batch that runs behind the app, not a stream the user
# is watching, and a synchronous seam is what lets `model::semantic` be tested
# with a fake instead of a server.
#
# This is why the embedder stayed in the shell when the model moved to
# brain-core: `semantic::Embedder` is a trait, and libsoup is one platform's
# answer to it. A macOS shell would hand the same trait URLSession rather than
# drag GLib along behind it.
soup = { package = "soup3", version = "0.9" }
# Timestamped attachment names. Frontmatter dates are brain-core's problem.
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }

[dev-dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
tempfile = "3"
